name: iOS y navegación

on:
  push:
    branches: ['codex/maratonia-*']
  pull_request:
    paths: ['Maraton/**', 'Maraton Watch App/**', 'Shared/**', 'Tests/**', 'Maraton.xcodeproj/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Revisar archivos Swift
        run: python3 scripts/chequear_swift.py
      - name: Compilar Release (iPhone y Apple Watch)
        run: >-
          xcodebuild build -project Maraton.xcodeproj -scheme Maraton
          -configuration Release -destination 'generic/platform=iOS Simulator'
          -derivedDataPath /tmp/maratonia-build CODE_SIGNING_ALLOWED=NO
      - name: Tests de dominio y recorridos de usuario
        run: >-
          xcodebuild test -project Maraton.xcodeproj -scheme Maraton
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5'
          -derivedDataPath /tmp/maratonia-build -resultBundlePath /tmp/Maratonia.xcresult
          -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Exportar capturas del recorrido
        if: always()
        run: |
          if [ -d /tmp/Maratonia.xcresult ]; then
            xcrun xcresulttool export attachments --path /tmp/Maratonia.xcresult --output-path /tmp/maratonia-capturas
          fi
      - name: Guardar resultados y capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maratonia-ios-resultados
          path: |
            /tmp/Maratonia.xcresult
            /tmp/maratonia-capturas
          retention-days: 7
